# One command: docker compose up --build   ->  http://localhost:3000 (mail: http://localhost:8025)
services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/booking
      BETTER_AUTH_SECRET: change-me-to-a-long-random-string-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Booking App <no-reply@booking.local>"
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: booking
    # host port 5433 for local dev (npm run dev); the app container talks to db:5432
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d booking"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
